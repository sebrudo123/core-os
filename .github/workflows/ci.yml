name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Scripts de personalización y perfil de archiso
  # ---------------------------------------------------------------------------
  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: shellcheck
        run: |
          shellcheck -x -S warning \
            customization/arch/scripts/*.sh \
            customization/arch/scripts/lib/*.sh \
            customization/arch/*.sh \
            customization/archiso/airootfs/root/customize_airootfs.sh \
            customization/archiso/profiledef.sh

      - name: Validar el perfil, los archivos y el asistente
        run: |
          bash customization/arch/check.sh
          python3 -m py_compile customization/setup/core-os-setup.py
          echo "asistente: correcto"

  # ---------------------------------------------------------------------------
  # Panel de administración (web-demo)
  # ---------------------------------------------------------------------------
  web-demo:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web-demo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-demo/package-lock.json

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Comprobación de sintaxis
        run: npm run check

      - name: Prueba de humo de la API
        run: |
          node server.js &
          SERVER_PID=$!
          sleep 3
          curl -fsS http://localhost:3000/api/health
          curl -fsS http://localhost:3000/api/status  | head -c 400
          curl -fsS http://localhost:3000/api/metrics | head -c 400
          kill "$SERVER_PID"
