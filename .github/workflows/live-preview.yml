name: Live Preview (escritorio en vivo por VNC)

# Arranca la ISO REAL de Core OS en una VM (QEMU/KVM) y la expone en el
# navegador mediante noVNC + un túnel público. Permite ver e INTERACTUAR con
# el escritorio de verdad (ratón/teclado) sin instalar nada.
#
# Además captura screenshots de la pantalla y los publica en <túnel>/shots/
# para poder diagnosticar el arranque (o ver la pantalla sin VNC).
#
# La sesión es efímera: dura lo que indique el input "minutes".

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release/tag de la ISO a arrancar'
        required: true
        default: 'v1.0.0'
      minutes:
        description: 'Minutos que se mantiene la sesión en vivo'
        required: true
        default: '60'
      memory:
        description: 'RAM de la VM (MB)'
        required: true
        default: '6144'

concurrency:
  group: live-preview
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Liberar espacio en disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Instalar QEMU, noVNC, websockify y utilidades
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils novnc websockify curl ca-certificates \
            socat imagemagick

      - name: Habilitar KVM (aceleración por hardware)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || echo "AVISO: /dev/kvm no disponible; se usará emulación por software (lento)"

      - name: Descargar y unir la ISO desde la Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p parts
          gh release download "${{ github.event.inputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" --pattern 'core-os-part-*' --dir parts
          cat parts/core-os-part-*.part > core-os-live.iso
          ls -lh core-os-live.iso

      - name: Arrancar la VM con VNC
        run: |
          set -euo pipefail
          ACCEL="kvm"; CPU="host"
          if [ ! -e /dev/kvm ]; then ACCEL="tcg"; CPU="max"; fi
          echo "Aceleración: $ACCEL (cpu=$CPU)"
          qemu-system-x86_64 \
            -name "Core OS Live" \
            -accel "$ACCEL" -cpu "$CPU" -smp 4 \
            -m "${{ github.event.inputs.memory }}" \
            -vga std -display none \
            -vnc :0 \
            -monitor unix:/tmp/mon.sock,server,nowait \
            -rtc base=utc \
            -device qemu-xhci -device usb-tablet \
            -netdev user,id=n0 -device e1000,netdev=n0 \
            -boot d \
            -drive file=core-os-live.iso,media=cdrom,readonly=on \
            > /tmp/qemu.log 2>&1 &
          echo $! > /tmp/qemu.pid
          sleep 3
          echo "QEMU arrancado (pid $(cat /tmp/qemu.pid))"
          tail -5 /tmp/qemu.log || true

      - name: Arrancar noVNC, túnel y captura de pantalla
        id: tunnel
        run: |
          set -euo pipefail
          nohup websockify --web=/usr/share/novnc 6080 localhost:5900 \
            > /tmp/websockify.log 2>&1 &
          sleep 2
          curl -fsS -o /dev/null "http://localhost:6080/vnc.html" \
            && echo "noVNC respondiendo en local" || echo "AVISO: noVNC no responde aún"

          # Captura de pantalla periódica (se sirve en <túnel>/shots/latest.png)
          sudo mkdir -p /usr/share/novnc/shots
          sudo chown "$USER" /usr/share/novnc/shots
          cat > /tmp/capture.sh <<'EOS'
          #!/usr/bin/env bash
          i=0
          while :; do
            i=$((i+1))
            printf 'screendump /tmp/shot.ppm\n' | socat - UNIX-CONNECT:/tmp/mon.sock >/dev/null 2>&1 || true
            sleep 1
            if [ -f /tmp/shot.ppm ]; then
              convert /tmp/shot.ppm /usr/share/novnc/shots/latest.png 2>/dev/null || true
              cp -f /usr/share/novnc/shots/latest.png "/usr/share/novnc/shots/shot-$(printf '%03d' $i).png" 2>/dev/null || true
              rm -f /tmp/shot.ppm
            fi
            sleep 4
          done
          EOS
          chmod +x /tmp/capture.sh
          nohup /tmp/capture.sh > /tmp/capture.log 2>&1 &

          # cloudflared: túnel HTTPS público (soporta WebSocket)
          curl -fsSL -o /tmp/cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i /tmp/cloudflared.deb >/dev/null 2>&1 || sudo apt-get -f install -y
          nohup cloudflared tunnel --url http://localhost:6080 --no-autoupdate \
            > /tmp/cloudflared.log 2>&1 &

          URL=""
          for _ in $(seq 1 45); do
            URL="$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -1 || true)"
            [ -n "$URL" ] && break
            sleep 2
          done

          if [ -z "$URL" ]; then
            echo "##[error] No se pudo obtener la URL pública del túnel"
            tail -30 /tmp/cloudflared.log
            exit 1
          fi

          NOVNC="${URL}/vnc.html?autoconnect=1&resize=scale&path=websockify&show_dot=1"
          echo "novnc_url=$NOVNC" >> "$GITHUB_OUTPUT"
          echo "tunnel_url=$URL" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$NOVNC" > live-url.txt
          printf '%s\n' "$URL" > tunnel-url.txt

          {
            echo "### 🖥️ Core OS — escritorio en vivo (VNC)"
            echo ""
            echo "- **Interactuar:** ${NOVNC}"
            echo "- **Captura actual:** ${URL}/shots/latest.png"
            echo "- Sesión efímera (~${{ github.event.inputs.minutes }} min)."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "=================================================="
          echo "ENLACE EN VIVO (noVNC): $NOVNC"
          echo "CAPTURA ACTUAL:         $URL/shots/latest.png"
          echo "=================================================="

      - name: Publicar el enlace como artefacto (recuperable por API)
        uses: actions/upload-artifact@v4
        with:
          name: live-url
          path: |
            live-url.txt
            tunnel-url.txt
          retention-days: 1

      - name: Mantener la sesión en vivo
        run: |
          echo "Sesión en vivo activa. Se cerrará en ${{ github.event.inputs.minutes }} min."
          for _ in $(seq 1 "${{ github.event.inputs.minutes }}"); do
            if ! kill -0 "$(cat /tmp/qemu.pid)" 2>/dev/null; then
              echo "La VM terminó antes de lo previsto."; tail -20 /tmp/qemu.log; exit 0
            fi
            sleep 60
          done
          echo "Tiempo completado; cerrando."

      - name: Registro final (por si algo falló)
        if: always()
        run: |
          echo "=== qemu.log ==="; tail -20 /tmp/qemu.log 2>/dev/null || true
          echo "=== websockify.log ==="; tail -10 /tmp/websockify.log 2>/dev/null || true
          echo "=== cloudflared.log ==="; tail -10 /tmp/cloudflared.log 2>/dev/null || true
          echo "=== capture.log ==="; tail -5 /tmp/capture.log 2>/dev/null || true
