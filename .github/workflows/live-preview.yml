name: Live Preview (escritorio de Core OS por VNC)

# Arranca la ISO REAL de Core OS en una máquina virtual (QEMU/KVM) y la expone
# en el navegador con noVNC + un túnel público. Permite VER e INTERACTUAR con el
# escritorio de verdad (ratón y teclado) sin instalar nada.
#
# Además publica capturas de pantalla y el registro de la consola serie en
# <túnel>/shots/ para poder diagnosticar el arranque.
#
# La sesión es efímera: dura los minutos indicados.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release/tag de la ISO a arrancar'
        required: true
        default: 'v2.0.0'
      run_id:
        description: 'ID de una ejecución de "Build Core OS ISO" (opcional: usa su artefacto en vez de la Release)'
        required: false
        default: ''
      minutes:
        description: 'Minutos que se mantiene la sesión en vivo'
        required: true
        default: '60'
      memory:
        description: 'Memoria de la máquina virtual (MB)'
        required: true
        default: '6144'
      firmware:
        description: 'Firmware de arranque (uefi muestra el menú de Core OS)'
        required: true
        default: 'uefi'
        type: choice
        options: [uefi, bios]

concurrency:
  group: live-preview
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Liberar espacio en disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Instalar QEMU, noVNC, OVMF y utilidades
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils novnc websockify ovmf curl ca-certificates \
            socat imagemagick

      - name: Habilitar KVM (aceleración por hardware)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || echo "AVISO: sin /dev/kvm; se usará emulación por software (lenta)"

      - name: Descargar la ISO
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          run_id="${{ inputs.run_id }}"
          mkdir -p dl parts
          if [ -n "$run_id" ]; then
            echo "Descargando la ISO del artefacto de la ejecución ${run_id}…"
            # `gh run download` ya descomprime el artefacto: deja el archivo tal cual.
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
              --pattern 'core-os-iso-*' --dir dl
            mv dl/*/core-os-*.iso core-os-live.iso
            echo "ISO obtenida del artefacto."
          elif gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
               --pattern '*.iso' --dir dl 2>/dev/null; then
            mv dl/*.iso core-os-live.iso
            echo "ISO descargada en un único archivo."
          else
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
              --pattern 'core-os-part-*' --dir parts
            cat parts/core-os-part-*.part > core-os-live.iso
            echo "ISO reconstruida a partir de las partes."
          fi
          ls -lh core-os-live.iso

      - name: Arrancar la máquina virtual
        run: |
          set -euo pipefail
          ACCEL="kvm"; CPU="host"
          [ -e /dev/kvm ] || { ACCEL="tcg"; CPU="max"; }
          echo "Aceleración: $ACCEL (cpu=$CPU)"

          # Firmware: con UEFI se ve el menú de arranque propio de Core OS (GRUB);
          # si no hay OVMF disponible se arranca en modo BIOS (syslinux).
          FW_ARGS=()
          if [ "${{ inputs.firmware }}" = "uefi" ]; then
            for code in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd \
                        /usr/share/ovmf/OVMF.fd; do
              if [ -f "$code" ]; then
                vars="$(dirname "$code")/OVMF_VARS${code##*OVMF_CODE}"
                if [ -f "$vars" ]; then
                  cp "$vars" /tmp/OVMF_VARS.fd
                  FW_ARGS=(-drive "if=pflash,format=raw,readonly=on,file=$code" \
                           -drive "if=pflash,format=raw,file=/tmp/OVMF_VARS.fd")
                else
                  FW_ARGS=(-bios "$code")
                fi
                echo "Firmware UEFI: $code"
                break
              fi
            done
          fi
          if [ "${#FW_ARGS[@]}" -eq 0 ]; then
            echo "Sin OVMF: arranque BIOS."
          fi

          qemu-system-x86_64 \
            -name "Core OS Live" \
            -accel "$ACCEL" -cpu "$CPU" -smp 4 \
            -m "${{ inputs.memory }}" \
            -vga std -display none \
            -vnc :0 \
            -monitor unix:/tmp/mon.sock,server,nowait \
            -serial file:/tmp/serial.log \
            -rtc base=utc \
            -device qemu-xhci -device usb-tablet \
            -netdev user,id=n0 -device e1000,netdev=n0 \
            "${FW_ARGS[@]}" \
            -boot order=d \
            -drive file=core-os-live.iso,media=cdrom,readonly=on \
            > /tmp/qemu.log 2>&1 &
          echo $! > /tmp/qemu.pid
          sleep 3
          echo "QEMU arrancado (pid $(cat /tmp/qemu.pid))"
          tail -5 /tmp/qemu.log || true

          # Captura del arranque inicial: el menú, el initramfs y los servicios.
          sudo mkdir -p /usr/share/novnc/shots
          sudo chown "$USER" /usr/share/novnc/shots
          echo "Capturando los primeros minutos del arranque…"
          for i in $(seq 1 90); do
            printf 'screendump /tmp/shot.ppm\n' | socat - UNIX-CONNECT:/tmp/mon.sock >/dev/null 2>&1 || true
            sleep 0.4
            if [ -f /tmp/shot.ppm ]; then
              convert /tmp/shot.ppm \
                "/usr/share/novnc/shots/boot-$(printf '%03d' "$i").png" 2>/dev/null || true
              rm -f /tmp/shot.ppm
            fi
            sleep 2
          done
          cp -f /tmp/serial.log /usr/share/novnc/shots/serial.log 2>/dev/null || true
          echo "Captura inicial completada."

      - name: Arrancar noVNC y el túnel público
        id: tunnel
        run: |
          set -euo pipefail
          nohup websockify --web=/usr/share/novnc 6080 localhost:5900 \
            > /tmp/websockify.log 2>&1 &
          sleep 2
          curl -fsS -o /dev/null http://localhost:6080/vnc.html \
            && echo "noVNC responde en local" || echo "AVISO: noVNC todavía no responde"

          curl -fsSL -o /tmp/cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i /tmp/cloudflared.deb >/dev/null 2>&1 || sudo apt-get -f install -y
          nohup cloudflared tunnel --url http://localhost:6080 --no-autoupdate \
            > /tmp/cloudflared.log 2>&1 &

          URL=""
          for _ in $(seq 1 45); do
            URL="$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -1 || true)"
            [ -n "$URL" ] && break
            sleep 2
          done
          if [ -z "$URL" ]; then
            echo "##[error] No se pudo obtener la URL pública del túnel"
            tail -30 /tmp/cloudflared.log
            exit 1
          fi

          NOVNC="${URL}/vnc.html?autoconnect=1&resize=scale&path=websockify&show_dot=1"
          echo "novnc_url=$NOVNC"     >> "$GITHUB_OUTPUT"
          printf '%s\n' "$NOVNC"       > live-url.txt
          printf '%s\n' "$URL"         > tunnel-url.txt

          {
            echo "### 🖥️ Core OS — escritorio en vivo (VNC)"
            echo ""
            echo "- **Interactuar:** ${NOVNC}"
            echo "- **Captura actual:** ${URL}/shots/latest.png"
            echo "- **Registro de arranque:** ${URL}/shots/serial.log"
            echo "- Sesión efímera (~${{ inputs.minutes }} min)."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "=================================================="
          echo "ENLACE EN VIVO (noVNC): $NOVNC"
          echo "CAPTURA:                $URL/shots/latest.png"
          echo "=================================================="

      - name: Publicar el enlace como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: live-url
          path: |
            live-url.txt
            tunnel-url.txt
          retention-days: 1

      - name: Recoger el informe de diagnóstico
        run: |
          # El medio en vivo escribe su informe en la consola serie (lo hace el
          # servicio core-os-diagnostico, ver customization/systemd/). Aquí se
          # espera a que termine y se copia para poder leerlo desde el túnel.
          set -uo pipefail
          SHOTS=/usr/share/novnc/shots
          sudo mkdir -p "$SHOTS"
          sudo chown "$USER" "$SHOTS"
          for _ in $(seq 1 12); do
            if grep -q 'FIN DEL DIAGNOSTICO (segundo)' /tmp/serial.log 2>/dev/null; then
              echo "Informe de diagnóstico completo."
              break
            fi
            sleep 15
          done
          cp -f /tmp/serial.log "$SHOTS/diag.txt" 2>/dev/null || true
          echo "--- final del informe ---"
          tail -40 "$SHOTS/diag.txt" 2>/dev/null || true

      - name: Sesión en vivo (capturas periódicas)
        run: |
          set -uo pipefail
          sudo mkdir -p /usr/share/novnc/shots
          sudo chown "$USER" /usr/share/novnc/shots
          MIN="${{ inputs.minutes }}"
          END=$(( $(date +%s) + MIN * 60 ))
          i=0
          echo "Sesión en vivo activa durante ${MIN} min."
          while [ "$(date +%s)" -lt "$END" ]; do
            if ! kill -0 "$(cat /tmp/qemu.pid)" 2>/dev/null; then
              echo "La máquina virtual terminó antes de lo previsto."
              tail -20 /tmp/qemu.log
              break
            fi
            i=$((i + 1))
            printf 'screendump /tmp/shot.ppm\n' | socat - UNIX-CONNECT:/tmp/mon.sock >/dev/null 2>&1 || true
            sleep 1
            if [ -f /tmp/shot.ppm ]; then
              convert /tmp/shot.ppm /usr/share/novnc/shots/latest.png 2>/dev/null || true
              if [ $((i % 4)) -eq 0 ]; then
                cp -f /usr/share/novnc/shots/latest.png \
                  "/usr/share/novnc/shots/shot-$(printf '%03d' "$i").png" 2>/dev/null || true
              fi
              cp -f /tmp/serial.log /usr/share/novnc/shots/serial.log 2>/dev/null || true
              rm -f /tmp/shot.ppm
            fi
            sleep 14
          done
          echo "Sesión finalizada ($i capturas)."

      - name: Registro final
        if: always()
        run: |
          echo "=== qemu.log ===";       tail -30 /tmp/qemu.log      2>/dev/null || true
          echo "=== websockify.log ==="; tail -10 /tmp/websockify.log 2>/dev/null || true
          echo "=== cloudflared.log ==="; tail -10 /tmp/cloudflared.log 2>/dev/null || true
