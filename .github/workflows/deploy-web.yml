name: Deploy Panel (Render)

# Render despliega automáticamente al recibir el push, así que este flujo es
# opcional: sirve para forzar un despliegue manual usando el "Deploy Hook" del
# servicio (secreto RENDER_DEPLOY_HOOK). Si el secreto no existe, no hace nada.
on:
  push:
    branches: [main]
    paths:
      - 'web-demo/**'
      - 'render.yaml'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

concurrency:
  group: deploy-panel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-demo/package-lock.json

      - name: Comprobar el panel antes de desplegar
        working-directory: web-demo
        run: |
          npm install --no-audit --no-fund
          npm run check

      - name: Lanzar el despliegue en Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          if [ -z "${RENDER_DEPLOY_HOOK:-}" ]; then
            echo "No hay RENDER_DEPLOY_HOOK: Render desplegará el push por su cuenta."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK" && echo "Despliegue lanzado."
