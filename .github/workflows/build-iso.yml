name: Build Core OS ISO

# Construye la ISO de Core OS (Arch Linux + GNOME) en cada push a main, en los
# tags v* y a mano. En los tags v* además publica una Release con la ISO.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_iso:
        description: 'Construir la ISO (tarda ~40 min); desmárcalo para validar solo'
        type: boolean
        default: true

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CORE_OS_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('0.0.0+{0}', github.run_number) }}

jobs:
  # ---------------------------------------------------------------------------
  # 1. Validación (rápida): scripts, asistente y perfil de archiso
  # ---------------------------------------------------------------------------
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Analizar los scripts de Core OS con shellcheck
        run: |
          shellcheck -x -S warning \
            customization/arch/scripts/*.sh \
            customization/arch/scripts/lib/*.sh \
            customization/arch/*.sh \
            customization/archiso/airootfs/root/customize_airootfs.sh \
            customization/archiso/profiledef.sh

      - name: Comprobar el asistente de instalación
        run: python3 -m py_compile customization/setup/core-os-setup.py

      - name: Comprobar el perfil y los archivos de Core OS
        run: bash customization/arch/check.sh

  # ---------------------------------------------------------------------------
  # 2. Construcción de la ISO dentro de un contenedor Arch Linux
  # ---------------------------------------------------------------------------
  build-iso:
    runs-on: ubuntu-24.04
    needs: validate
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_iso }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Ampliar el espacio disponible
        run: |
          echo "Antes:"; df -h / /mnt || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup \
            /usr/share/swift /opt/az /usr/local/lib/node_modules || true
          sudo apt-get clean
          # El volumen /mnt es mucho mayor que /: ahí van los datos del build.
          sudo mkdir -p /mnt/core-os-build
          sudo chown -R "$USER" /mnt/core-os-build
          echo "Después:"; df -h / /mnt || true

      - name: Construir la ISO (contenedor Arch Linux)
        env:
          OUT_DIR: /build/out
          WORK_DIR: /build/work
        run: |
          set -euo pipefail
          docker run --rm --privileged \
            -v "$PWD":/work -w /work \
            -v /mnt/core-os-build:/build \
            -e OUT_DIR=/build/out \
            -e WORK_DIR=/build/work \
            -e CORE_OS_VERSION="$CORE_OS_VERSION" \
            -e SOURCE_DATE_EPOCH="$(date +%s)" \
            archlinux:latest \
            bash -c '
              set -euo pipefail
              pacman-key --init
              pacman-key --populate archlinux
              pacman -Syu --noconfirm --needed archiso libisoburn squashfs-tools \
                dosfstools mtools grub syslinux
              ./customization/arch/build-iso.sh
            '

      - name: Recoger el resultado
        run: |
          set -euo pipefail
          mkdir -p customization/out
          cp -v /mnt/core-os-build/out/*.iso customization/out/
          cp -v /mnt/core-os-build/out/SHA256SUMS customization/out/
          ls -lh customization/out
          cat customization/out/SHA256SUMS

      - name: Guardar la ISO como artefacto (por si la Release no aplica)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: core-os-iso-${{ env.CORE_OS_VERSION }}
          path: |
            customization/out/*.iso
            customization/out/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      # GitHub limita cada archivo de una Release a 2 GB: si la ISO los supera
      # se publica dividida en partes y se explica cómo unirla.
      - name: Preparar los archivos de la Release
        if: startsWith(github.ref, 'refs/tags/v')
        id: assets
        run: |
          set -euo pipefail
          cd customization/out
          iso="$(ls -1 ./*.iso | head -1)"
          size="$(stat -c%s "$iso")"
          echo "ISO: ${iso} ($((size / 1048576)) MB)"
          if [ "$size" -lt 2100000000 ]; then
            {
              echo "files<<ASSETS_EOF"
              echo "$iso"
              echo "SHA256SUMS"
              echo "ASSETS_EOF"
            } >> "$GITHUB_OUTPUT"
            echo "info=La ISO cabe en un único archivo." >> "$GITHUB_OUTPUT"
          else
            split -b 1900M --numeric-suffixes=1 --suffix-length=2 \
              --additional-suffix=.part "$iso" core-os-part-
            sha256sum core-os-part-* > PARTS-SHA256SUMS
            rm -f "$iso"
            {
              echo "files<<ASSETS_EOF"
              ls -1 core-os-part-*
              echo "PARTS-SHA256SUMS"
              echo "ASSETS_EOF"
            } >> "$GITHUB_OUTPUT"
            echo "info=La ISO supera los 2 GB de GitHub: se publica en partes." >> "$GITHUB_OUTPUT"
          fi
          ls -lh

      - name: Publicar la Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # Los archivos preparados en el paso anterior están en customization/out
          working-directory: customization/out
          name: Core OS ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Core OS ${{ github.ref_name }}

            Sistema operativo basado en **Arch Linux** con escritorio GNOME y
            aspecto tipo Windows 11.

            ${{ steps.assets.outputs.info }}

            **Descarga y comprobación**

            ```bash
            sha256sum -c SHA256SUMS
            ```

            Si la Release incluye archivos `core-os-part-*.part`, únelos antes de
            usar la ISO:

            ```bash
            cat core-os-part-*.part > core-os.iso
            sha256sum -c PARTS-SHA256SUMS
            ```

            **Requisitos:** 64 bits, 4 GB de RAM (8 GB recomendable) y 25 GB de disco.
          files: ${{ steps.assets.outputs.files }}

  # ---------------------------------------------------------------------------
  # 3. Código fuente de Core OS (artefacto ligero)
  # ---------------------------------------------------------------------------
  package:
    runs-on: ubuntu-24.04
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Empaquetar la personalización
        run: |
          tar \
            --exclude='customization/out' \
            --exclude='customization/work' \
            --exclude='web-demo/node_modules' \
            -czf "core-os-source-${CORE_OS_VERSION}.tar.gz" \
            customization web-demo

      - uses: actions/upload-artifact@v4
        with:
          name: core-os-source-${{ env.CORE_OS_VERSION }}
          path: core-os-source-*.tar.gz
          if-no-files-found: error
          retention-days: 30
