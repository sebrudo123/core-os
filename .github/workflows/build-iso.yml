name: Build Core OS ISO

# Se ejecuta en cada push a main, en tags v* y manualmente.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ubuntu_release:
        description: 'Release de Ubuntu base'
        required: true
        default: '24.04'
      ubuntu_codename:
        description: 'Codename de Ubuntu base'
        required: true
        default: 'noble'
      build_iso:
        description: 'Construir la ISO completa (consume ~20GB / 30min)'
        type: boolean
        required: true
        default: true

# Evita builds concurrentes del mismo ref.
concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  UBUNTU_RELEASE: ${{ github.event.inputs.ubuntu_release || '24.04' }}
  UBUNTU_CODENAME: ${{ github.event.inputs.ubuntu_codename || 'noble' }}
  CORE_OS_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('0.0.0+{0}', github.run_number) }}

jobs:
  # ---------------------------------------------------------------------------
  # 1. Validación rápida de la personalización
  # ---------------------------------------------------------------------------
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Analizar scripts de personalización
        run: shellcheck -x -S warning customization/scripts/*.sh customization/build-iso.sh

      - name: Validar scripts con "bash -n"
        run: |
          for f in customization/scripts/*.sh customization/build-iso.sh; do
            echo "-> syntax check $f"
            bash -n "$f"
          done

      - name: Validar listas de paquetes
        run: |
          test -s customization/packages/packages.list
          grep -vE '^\s*(#|$)' customization/packages/packages.list

  # ---------------------------------------------------------------------------
  # 2. Empaquetado de la personalización (artefacto ligero, siempre disponible)
  # ---------------------------------------------------------------------------
  package:
    runs-on: ubuntu-24.04
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Empaquetar customization/ + web-demo/
        run: |
          tar \
            --exclude='customization/out' \
            --exclude='customization/work' \
            --exclude='customization/cache' \
            --exclude='web-demo/node_modules' \
            --exclude='web-demo/.vercel' \
            -czf "core-os-source-${CORE_OS_VERSION}.tar.gz" \
            customization web-demo

      - name: Subir artefacto de personalización
        uses: actions/upload-artifact@v4
        with:
          name: core-os-source-${{ env.CORE_OS_VERSION }}
          path: core-os-source-*.tar.gz
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 3. Construcción de la ISO (headless, sin Cubic)
  # ---------------------------------------------------------------------------
  build-iso:
    runs-on: ubuntu-24.04
    needs: package
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_iso }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Libera espacio: los runners traen ~14GB útiles y una ISO de escritorio
      # necesita ~30GB (ISO + árbol extraído + squashfs). Se eliminan los
      # toolchains preinstalados que no usamos.
      - name: Liberar espacio en disco
        run: |
          echo "Antes:"; df -h /
          sudo rm -rf /usr/share/dotnet \
                      /usr/local/lib/android \
                      /opt/ghc \
                      /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost \
                      /usr/local/.ghcup \
                      /usr/share/swift \
                      /opt/az \
                      /usr/local/lib/node_modules \
                      "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          sudo apt-get autoremove -y || true
          sudo docker image prune -a -f 2>/dev/null || true
          echo "Después:"; df -h /

      - name: Instalar dependencias de construcción
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xorriso squashfs-tools rsync wget ca-certificates \
            isolinux syslinux-utils genisoimage

      - name: Construir la ISO de Core OS
        env:
          CORE_OS_RELEASE: ${{ env.CORE_OS_VERSION }}
          UBUNTU_RELEASE: ${{ env.UBUNTU_RELEASE }}
          UBUNTU_CODENAME: ${{ env.UBUNTU_CODENAME }}
          # gzip es más rápido que xz (menos riesgo de agotar el tiempo del job).
          CORE_OS_SQUASHFS_COMP: gzip
        run: |
          sudo --preserve-env=CORE_OS_RELEASE,UBUNTU_RELEASE,UBUNTU_CODENAME,CORE_OS_SQUASHFS_COMP \
            ./customization/build-iso.sh --release "${CORE_OS_RELEASE}"

      - name: Generar checksums
        run: |
          cd customization/out
          # El árbol lo crea root al construir con sudo; se generan los checksums
          # como root y se devuelve la propiedad del directorio al runner para
          # poder dividir/subir la ISO más adelante.
          sudo sh -c 'sha256sum ./*.iso > SHA256SUMS'
          sudo chown -R "$USER" . 2>/dev/null || true
          cat SHA256SUMS

      # Nota: una ISO de ~6 GB supera la cuota de artefactos de GitHub para
      # muchos planes, por eso la subida es "mejor esfuerzo" (no rompe el build).
      - name: Subir la ISO (mejor esfuerzo)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: core-os-iso-${{ env.CORE_OS_VERSION }}
          path: |
            customization/out/*.iso
            customization/out/SHA256SUMS
          if-no-files-found: warn
          retention-days: 7

      # En las etiquetas v* se publica una Release. GitHub limita cada asset a
      # 2 GB, así que la ISO se divide en partes de <2 GB.
      - name: Preparar assets de la Release (solo en tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        run: |
          cd customization/out
          rm -f core-os-part-* PARTS-SHA256SUMS
          iso="$(ls ./*.iso | head -1)"
          split -b 1900M --numeric-suffixes=1 --suffix-length=2 \
            --additional-suffix=.part "$iso" core-os-part-
          sha256sum core-os-part-* > PARTS-SHA256SUMS
          ls -lh core-os-part-* PARTS-SHA256SUMS

      - name: Publicar Release (solo en tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          name: Core OS ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            customization/out/core-os-part-*
            customization/out/PARTS-SHA256SUMS
            customization/out/SHA256SUMS
