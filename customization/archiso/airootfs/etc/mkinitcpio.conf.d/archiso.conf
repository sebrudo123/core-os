# ===========================================================================
#  Core OS — ganchos (hooks) del initramfs del medio en vivo.
#
#  Este archivo lo aporta el perfil de archiso y SOLO afecta al sistema en vivo
#  (el instalador lo elimina del sistema final, que usa los ganchos normales de
#  Arch Linux).
#
#  No se incluyen los ganchos de arranque por red (`archiso_pxe_*`) porque sus
#  binarios (ipconfig, nbd-client, nfsmount) no están en el medio: al no usarse,
#  solo harían que mkinitcpio terminase con errores.
# ===========================================================================
HOOKS=(base udev microcode modconf kms memdisk archiso archiso_loop_mnt block filesystems keyboard)
COMPRESSION="xz"
COMPRESSION_OPTIONS=(-9e)
