# ===========================================================================
#  Core OS — configuración de GDM
#
#  En el MEDIO EN VIVO se entra automáticamente como usuario `core` (ver
#  customization/arch/scripts/30-live-user.sh). El instalador de Core OS deja
#  este archivo SIN autologin en el sistema final.
# ===========================================================================
[daemon]
# Core OS usa la sesión de Xorg: es la que mejor funciona en máquinas
# virtuales y en equipos con controladoras gráficas antiguas (el medio en vivo
# tiene que arrancar en cualquier sitio). El escritorio se ve igual.
WaylandEnable=false
AutomaticLoginEnable=true
AutomaticLogin=core

[security]

[xdmcp]

[chooser]

[debug]
