# ===========================================================================
#  Core OS — resolución de nombres.
#
#  Este archivo es un marcador de emergencia: en cuanto arranca el sistema,
#  NetworkManager (o systemd-resolved) escriben aquí los servidores DNS que
#  recibe por DHCP. Se usa un archivo normal —y no un enlace a
#  /run/systemd/resolve/stub-resolv.conf— porque durante la construcción la
#  raíz del medio se monta con `arch-chroot`, que sustituye este archivo por
#  el del equipo anfitrión (necesario para instalar paquetes y dependencias).
#  El INSTALADOR sí deja el enlace a systemd-resolved en el sistema final.
# ===========================================================================
nameserver 1.1.1.1
nameserver 8.8.8.8
