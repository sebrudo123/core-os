LABEL existing
TEXT HELP
Arranca un sistema operativo ya instalado en el disco.
Pulsa TAB para indicar el disco y la partición (por ejemplo hd1 2).
ENDTEXT
MENU LABEL Arrancar un sistema ya instalado
COM32 chain.c32

LABEL reboot
TEXT HELP
Reinicia el equipo.
ENDTEXT
MENU LABEL Reiniciar el equipo
COM32 reboot.c32

LABEL poweroff
TEXT HELP
Apaga el equipo.
ENDTEXT
MENU LABEL Apagar el equipo
COM32 poweroff.c32
