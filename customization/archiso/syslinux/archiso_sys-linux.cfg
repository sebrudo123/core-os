LABEL coreos
TEXT HELP
Inicia Core OS en modo LIVE (BIOS).
Permite probar el escritorio o instalar Core OS en el disco.
ENDTEXT
MENU LABEL ^Iniciar Core OS (Live, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%

LABEL coreosnomodeset
TEXT HELP
Inicia Core OS en modo LIVE con el controlador de vídeo básico.
Úsalo si la pantalla se queda en negro al arrancar.
ENDTEXT
MENU LABEL Iniciar Core OS (Live, modo básico de ^vídeo)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset %KERNEL_PARAMS%
