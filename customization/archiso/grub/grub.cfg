# ===========================================================================
#  Core OS — menú de arranque (UEFI, GRUB)
#
#  Los marcadores %...% los sustituye mkarchiso al construir la ISO.
#  Este archivo se copia dentro del binario de GRUB y, al arrancar, busca el
#  volumen de la ISO y carga la configuración de verdad.
# ===========================================================================

# --- Sistemas de archivos y tablas de particiones --------------------------
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ntfs
insmod exfat
insmod udf

# --- Módulos gráficos y de entrada ----------------------------------------
insmod all_video
insmod video
insmod font
insmod gfxterm
insmod gfxmenu
insmod png
insmod jpeg
insmod usb_keyboard
insmod keylayouts
insmod serial

# --- Salida gráfica (necesaria para el tema de Core OS) --------------------
# La fuente viaja en la ISO (la prepara customization/arch/stage.sh), porque
# el binario de GRUB que genera archiso no lleva ninguna incrustada.
if loadfont (${root})/boot/grub/fonts/unicode.pf2 ; then
    set gfxmode="auto,1024x768,800x600"
    terminal_input console
    # Si el firmware no ofrece un modo gráfico utilizable se vuelve al modo
    # texto: nunca se queda la pantalla en negro.
    terminal_output gfxterm || terminal_output console
fi

# --- Consola serie (diagnóstico en CI y en servidores) --------------------
if serial --unit=0 --speed=115200; then
    terminal_input --append serial
    terminal_output --append serial
fi

# --- Identidad de Core OS -------------------------------------------------
if [ -f "($root)/boot/grub/themes/core-os/theme.txt" ]; then
    set theme=($root)/boot/grub/themes/core-os/theme.txt
    export theme
fi
set menu_color_normal=light-gray/black
set menu_color_highlight=cyan/black

if [ "${grub_platform}" == 'efi' ]; then
    core_os_platform='UEFI'
else
    core_os_platform='BIOS'
fi

default=core-os
timeout=10
timeout_style=menu

# --- Entradas del menú ----------------------------------------------------
menuentry "Iniciar Core OS (Live)" --class core-os --class gnu-linux --class os --id 'core-os' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "Iniciar Core OS (Live, modo básico de vídeo)" --hotkey=n --class core-os --class gnu-linux --class os --id 'core-os-nomodeset' {
    set gfxpayload=text
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "Arrancar desde el primer disco duro" --class hd --id 'hd' {
    set root=hd0
    chainloader +1
}

if [ "${grub_platform}" == 'efi' ]; then
    menuentry "Configuración del firmware (UEFI)" --id 'uefi-firmware' {
        fwsetup
    }
fi

menuentry "Apagar el equipo" --class shutdown {
    halt
}

menuentry "Reiniciar el equipo" --class reboot {
    reboot
}
