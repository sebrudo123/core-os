# ===========================================================================
#  Core OS — arranque desde un archivo ISO (loopback)
#
#  Lo usan las herramientas de arranque múltiple (Ventoy, GRUB personalizado…)
#  cuando la ISO de Core OS se arranca como un ARCHIVO en lugar de grabarse en
#  un disco. La variable `iso_path` debe apuntar al archivo de la ISO.
# ===========================================================================

# Buscar el volumen que contiene la ISO
search --no-floppy --set=archiso_img_dev --file "${iso_path}"
probe --set archiso_img_dev_uuid --fs-uuid "${archiso_img_dev}"

if [ "${grub_platform}" == 'efi' ]; then
    archiso_platform='UEFI'
else
    archiso_platform='BIOS'
fi

default=core-os
timeout=15
timeout_style=menu

menuentry "Iniciar Core OS (Live, ${archiso_platform})" --class core-os --class gnu-linux --class os --id 'core-os' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% \
        img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "Iniciar Core OS (Live, modo básico de vídeo)" --hotkey=n --class core-os --class gnu-linux --class os --id 'core-os-nomodeset' {
    set gfxpayload=text
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% \
        img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" nomodeset %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

if [ "${grub_platform}" == 'efi' ]; then
    menuentry "Configuración del firmware (UEFI)" --id 'uefi-firmware' {
        fwsetup
    }
fi

menuentry "Apagar el equipo" --class shutdown {
    halt
}

menuentry "Reiniciar el equipo" --class reboot {
    reboot
}
